# 路径使用相对于脚本所在目录的相对路径（推荐），或绝对路径
LUBAN_DLL=.\Luban\Luban.dll

# ---------------- 主配置（与语言无关） ----------------
# 客户端/服务端共用的表声明：不含多语言表，因此这一趟不需要 --variant。
CONF=luban.conf
CUSTOM_TEMPLATE_ROOT=.\CustomTemplate\

PATH_VALIDATOR_ROOT=..\Client\

DATA_OUTPUT_PATH_CLIENT=..\Client\Assets\AssetRaw\Default\Config\Table\
CODE_OUTPUT_PATH_CLIENT=..\Client\Assets\Scripts\GameProto\Gen\

DATA_OUTPUT_PATH_SERVER=..\Server\Config\Table\
CODE_OUTPUT_PATH_SERVER=..\Server\Scripts\Config\Gen\

CONFIG_SCRIPT_SOURCE=.\CustomTemplate\LubanHandler.cs
CONFIG_SCRIPT_TARGET=..\Client\Assets\Scripts\GameProto\LubanHandler.cs
CONFIGINIT_SCRIPT_SOURCE=.\CustomTemplate\LubanHandler_Init.cs
CONFIGINIT_SCRIPT_TARGET=..\Client\Assets\Scripts\GameProto\LubanHandler_Init.cs

EXTERNALTYPEUTIL_SCRIPT_SOURCE=.\CustomTemplate\ExternalTypeUtil.cs
EXTERNALTYPEUTIL_SCRIPT_TARGET=..\Client\Assets\Scripts\GameProto\ExternalTypeUtil.cs

# ---------------- 多语言配置（按语言拆分） ----------------
# 支持的语言清单，空格分隔，本行是多语言链路的唯一真源：
# 变体声明 xml、按语言的数据目录、运行期语言常量文件都由它派生。
# 新增语言只改这里，再把 Excels/L10n/*.xlsx 的子列头补上 text@<语言码>。
L10N_LANGUAGES=zh-Hans en

# 变体所在的 bean 字段名，数据表第 3 行子列头即 <本字段>@<语言码>。
L10N_BEAN_FIELD=text

# 多语言表专用 conf：schema 只含 L10n，服务端趟不引用它，故不接触变体。
L10N_CONF=luban_l10n.conf

# 由 Tools\gen_l10n_schema.ps1 按 L10N_LANGUAGES 生成，勿手改、不入库。
L10N_SCHEMA_XML=Temp\l10n_schema.xml

# 多语言代码生成根目录。必须与 CODE_OUTPUT_PATH_CLIENT 分开：
# 每一趟的代码 saver 都会清掉自己输出目录里不属于本次范围的文件。
CODE_OUTPUT_PATH_L10N=..\Client\Assets\Scripts\GameProto\Gen\L10n\

# 运行期语言常量文件（L10nLanguages.Codes），供 LubanHandler 自报可用语言。
L10N_LANG_LIST_CODE=..\Client\Assets\Scripts\GameProto\L10nLanguages.cs
