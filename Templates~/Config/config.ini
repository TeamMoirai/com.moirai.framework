; 转表唯一配置。分节只作分组，键名全局唯一；';' 与 '#' 起始行是注释。
; 读它的是 gen.sh（唯一驱动），写它的是框架编辑器「更新配置路径」。
; 路径一律相对本文件所在目录，统一用正斜杠（Windows 与 bash 都接受，
; 省掉旧 path_export.sh 的反斜杠转换那一步——它当年被 xargs 一起削坏了）。

[tools]
; Luban 可执行体与代码模板根目录
LUBAN_DLL=Luban/Luban.dll
CUSTOM_TEMPLATE_ROOT=Templates/

[luban]
; 生成路线：bin = -c cs-bin -d bin（ByteBuf）；json = -c cs-simple-json -d json（SimpleJSON）。
; 运行期不用改处理器——LubanHandler 按生成的 Tables 构造器里 loader 的返回类型自动选 ByteBuf/JSONNode。
DATA_FORMAT=bin
; 加载类型：true = 用 Templates/Client_LazyLoad 下的模板，构造期一张表都不读，
; 首次访问才装载并解引用；false/eager = 用 Luban 内置模板（构造期加载全部表）。
; 一次转表只出一条路线，两条路线的产物会互相覆盖同名文件；换路线就整批重跑一次。
LAZY_LOAD=true

; 常规表 conf：不含多语言 schema，因此这一趟与服务端趟都不需要 --variant
CONF=luban.conf
; 多语言 conf：schema 只含 L10n，manager=L10nTables，按语言逐趟导数据时用
L10N_CONF=luban_l10n.conf
; 资源路径校验根目录（pathValidator.rootDir）
PATH_VALIDATOR_ROOT=../Client/

[client]
; 代码与数据的落点。
; 每趟的 saver 都会清掉"自己输出目录里不属于本次生成范围"的文件，主趟更是递归清，
; 所以顺序钉死为 常规 → 多语言代码（该趟关清理）→ 各语言数据 → 语言常量。
DATA_OUTPUT_PATH_CLIENT=../Client/Assets/AssetRaw/Default/Config/Table/
CODE_OUTPUT_PATH_CLIENT=../Client/Assets/Scripts/GameProto/Gen/

; 转表期拷进项目的处理器（源头在 Templates，改这里不如改模板）
CONFIG_SCRIPT_SOURCE=Templates/LubanHandler.cs
CONFIG_SCRIPT_TARGET=../Client/Assets/Scripts/GameProto/LubanHandler.cs
CONFIGINIT_SCRIPT_SOURCE=Templates/LubanHandler_Init.cs
CONFIGINIT_SCRIPT_TARGET=../Client/Assets/Scripts/GameProto/LubanHandler_Init.cs
EXTERNALTYPEUTIL_SCRIPT_SOURCE=Templates/ExternalTypeUtil.cs
EXTERNALTYPEUTIL_SCRIPT_TARGET=../Client/Assets/Scripts/GameProto/ExternalTypeUtil.cs

[server]
DATA_OUTPUT_PATH_SERVER=../Server/Config/Table/
CODE_OUTPUT_PATH_SERVER=../Server/Scripts/Config/Gen/

[l10n]
; 支持的语言清单，空格分隔。整条多语言链路的唯一真源：
; 变体声明 xml、按语言的数据目录、运行期语言常量都由它派生。
; 新增语言还要在 Excels/L10n/*.xlsx 的子列头补 <字段>@<语言码>。
L10N_LANGUAGES=zh-Hans en
; 变体所在的 bean 字段名，数据表第 3 行子列头即 <本字段>@<语言码>
L10N_BEAN_FIELD=text
; 运行期语言常量文件（L10nLanguages.Codes），游戏侧处理器据此自报可用语言。
; 放在 Gen/L10n/ 下与其他生成代码同树；gen.sh 把它排在所有趟之后写，
; 因为常规趟的代码 saver 会清掉输出目录里不属于本次生成范围的文件。
L10N_LANG_LIST_CODE=../Client/Assets/Scripts/GameProto/Gen/L10n/L10nLanguages.cs
L10N_LANG_CLASS_NAMESPACE=Moirai.GameProto.Config
; 变体声明 xml 的落点，每次转表重生成，不入库（见 .gitignore 的 Temp/）
L10N_SCHEMA_XML=Temp/l10n_schema.xml
