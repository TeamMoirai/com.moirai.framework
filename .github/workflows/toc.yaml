name: TOC Generator

on:
  push:
    paths:
      - 'README.md'
      - 'README_*.md'

jobs:
  toc:
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - target: 'README.md'
            title: '## 📚 目录'
    uses: TeamMoirai/GitHubActions/.github/workflows/_toc-generator.yaml@master
    with:
      TOC_TITLE: ${{ matrix.title }}
      TARGET_PATHS: ${{ matrix.target }}
    secrets: inherit
