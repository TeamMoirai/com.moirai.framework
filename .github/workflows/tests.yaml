# EditMode + PlayMode 回归门禁。
#
# 触发：仅 pull_request（2026-09-24 裁定，不在 master push 上跑以省资源）。
#
# 关键约束：本仓库是 UPM 包，没有 ProjectSettings/ 与 Packages/manifest.json，
# game-ci/unity-test-runner 无法直接对着本仓库跑测试。测试必须在**宿主 Unity 工程**里执行
# ——宿主工程的 Packages/manifest.json 以 submodule 方式引用本包，所以宿主跑一次
# EditMode/PlayMode，本包的 Tests/** 就被覆盖。
#
# 因此 EditMode/PlayMode 的 checkout 拉取宿主工程仓库（HOST_REPOSITORY），而不是本仓库。
# 宿主 submodule 记录的是宿主 master 上的旧 SHA——checkout 后必须把 Packages/com.moirai.framework
# 钉到 PR head（pull ref 在基仓库有镜像，fork PR 同样可用），否则门禁跑的是旧代码。
# 接入时按实际情况调整 HOST_REPOSITORY / HOST_REF，并确保 HOST_REPO_TOKEN 对宿主仓库有读权限；
# Unity 许可证走 UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD（game-ci 惯例）。
# （另一条路是在本仓库内建 build-release.yaml 注释里提到过的 Sandbox/Unity 宿主工程；
#   该目录目前并不存在，属于尚未落地的设想。）
#
# player-assembly-shape 已生效：纯文件形状校验，直接 checkout 本仓库即可，
# 不依赖宿主工程与 Unity 许可证；校验对象恒为 PR head。

name: Tests

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOST_REPOSITORY: TeamMoirai/Client
  HOST_REF: master

jobs:
  convention-guards:
    name: Convention guards (layer edges / facade seams / config surface)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout framework package (PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # 三条可执行守卫在 PR 上先行：层界棘轮（check_layer_edges.py）、门面接缝（check_facade_seams.py）。
      # config-surface 守卫的 B/C/D 段需要命令文件装配前端，CI 无前端环境取不到声明集（exit 2 量不出来），
      # 上 CI 会恒红——它由本地跑继续承担；E/F 两段在 CI 环境可跑，单独以 section 选择性执行留待量具支持。
      - name: Run layer-edges guard
        run: python3 .agent/skills/moirai-conventions/scripts/check_layer_edges.py --root .

      - name: Run facade-seams guard
        run: python3 .agent/skills/moirai-conventions/scripts/check_facade_seams.py --root .

  editmode:
    name: EditMode
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout host project (with submodules)
        uses: TeamMoirai/GitHubActions/.github/actions/checkout@master
        with:
          repository: ${{ env.HOST_REPOSITORY }}
          ref: ${{ env.HOST_REF }}
          token: ${{ secrets.HOST_REPO_TOKEN }}
          submodules: recursive
          lfs: true
          fetch-depth: 1

      # 宿主 submodule 记录的是宿主 master 的旧 SHA：fetch PR 的 pull ref（基仓库镜像，fork PR
      # 同样可用）后钉到 PR head，保证门禁跑的是本 PR 的代码。GITHUB_TOKEN 对基仓库只读即够。
      - name: Pin framework package to PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg="Packages/com.moirai.framework"
          pr_head="${{ github.event.pull_request.head.sha }}"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -C "$pkg" -c "http.https://github.com/.extraheader=$auth" fetch origin "+refs/pull/${{ github.event.pull_request.number }}/head"
          git -C "$pkg" checkout -q --detach "$pr_head"
          echo "Pinned $pkg -> $pr_head"

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          projectPath: .
          testMode: EditMode
          artifactsPath: TestResults/EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - name: Upload EditMode results
        if: always()
        uses: TeamMoirai/GitHubActions/.github/actions/upload-artifact@master
        with:
          name: editmode-results
          path: TestResults/EditMode

  playmode:
    name: PlayMode
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout host project (with submodules)
        uses: TeamMoirai/GitHubActions/.github/actions/checkout@master
        with:
          repository: ${{ env.HOST_REPOSITORY }}
          ref: ${{ env.HOST_REF }}
          token: ${{ secrets.HOST_REPO_TOKEN }}
          submodules: recursive
          lfs: true
          fetch-depth: 1

      # 宿主 submodule 记录的是宿主 master 的旧 SHA：fetch PR 的 pull ref（基仓库镜像，fork PR
      # 同样可用）后钉到 PR head，保证门禁跑的是本 PR 的代码。GITHUB_TOKEN 对基仓库只读即够。
      - name: Pin framework package to PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg="Packages/com.moirai.framework"
          pr_head="${{ github.event.pull_request.head.sha }}"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -C "$pkg" -c "http.https://github.com/.extraheader=$auth" fetch origin "+refs/pull/${{ github.event.pull_request.number }}/head"
          git -C "$pkg" checkout -q --detach "$pr_head"
          echo "Pinned $pkg -> $pr_head"

      - name: Run PlayMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          projectPath: .
          testMode: PlayMode
          artifactsPath: TestResults/PlayMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode Test Results

      - name: Upload PlayMode results
        if: always()
        uses: TeamMoirai/GitHubActions/.github/actions/upload-artifact@master
        with:
          name: playmode-results
          path: TestResults/PlayMode

  player-assembly-shape:
    name: Player assembly shape
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout framework package (PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # 玩家专用套件（Moirai.Atropos.Tests.Player）跑不了命令行：它的测试入口是构建期注入的
      # 引导场景，且结果通过 PlayerConnection 回传编辑器。这里退一步做**编译面**校验——
      # 确认它仍只在带测试的构建里存在、对编辑器可见，且没被钉成编辑器专用而悄悄退出玩家构建。
      # 引用面是 GUID 形式，按名字 grep 永不命中，所以这里不冒充「没引用编辑器程序集」的判据——
      # 那一条由玩家侧真跑（L3）承担。
      - name: Assert player test assembly constraints
        shell: bash
        run: |
          set -euo pipefail
          asmdef="Tests/Player/Moirai.Atropos.Tests.Player.asmdef"
          if [ ! -f "$asmdef" ]; then
            echo "::error::missing $asmdef"
            exit 1
          fi
          grep -q '"UNITY_INCLUDE_TESTS"' "$asmdef" || { echo "::error::$asmdef must require UNITY_INCLUDE_TESTS"; exit 1; }
          if grep -q '"!UNITY_EDITOR"' "$asmdef"; then
            echo "::error::$asmdef must stay editor-visible: UTF player runs only collect assemblies the editor can see"
            exit 1
          fi
          if grep -Eq '"includePlatforms"[[:space:]]*:[[:space:]]*\[[[:space:]]*"Editor"' "$asmdef"; then
            echo "::error::$asmdef must not be pinned to the Editor platform, or it disappears from player builds"
            exit 1
          fi
          echo "Player test assembly shape OK."
