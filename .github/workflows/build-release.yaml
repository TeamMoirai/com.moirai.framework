  # release
  create-release:
    needs: [update-packagejson, release-notes] # notes 切不出来就别落 tag
#    needs: [update-packagejson, publish, release-notes]
    permissions:
      contents: write
      id-token: write # required for NuGet Trusted Publish
    uses: TeamMoirai/GitHubActions/.github/workflows/create-release.yaml@master
    with:
      commit-id: ${{ needs.update-packagejson.outputs.sha }}
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      nuget-push: false
      release-upload: false
#      release-upload: true
#      release-asset-path: ./com.moirai.framework.${{ inputs.tag }}.unitypackage/com.moirai.framework.${{ inputs.tag }}.unitypackage
    secrets: inherit

  apply-release-notes:
    name: Publish with CHANGELOG notes
    needs: [release-notes, create-release]
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: write # release edit 走 contents 权限
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: TeamMoirai/GitHubActions/.github/actions/download-artifact@master
        with:
          name: release-notes
          path: release-notes

      - name: Overwrite the generated body and publish
        env:
          TAG: ${{ inputs.tag }}
          NOTES: ${{ github.workspace }}/release-notes/release-notes.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --draft=false --notes-file "${NOTES}"

          # 自证两件事：真的公开了，且 body 就是刚生成那份 notes。
          if [ "$(gh release view "${TAG}" --json isDraft -q .isDraft)" != "false" ]; then
            echo "::error::release ${TAG} 仍是草稿，Publish 没生效。"
            exit 1
          fi
          body="$(gh release view "${TAG}" --json body -q .body)"
          last="$(grep -v '^[[:space:]]*$' "${NOTES}" | tail -1)"
          # 固定子串匹配；case 写法要靠引号才按字面匹配，少一对引号就退化成 glob 假绿。
          if ! grep -F -q -- "${last}" <<<"${body}"; then
            echo "::error::Release notes 没落到 release ${TAG} 上。"
            exit 1
          fi

  clear-changelog:
    name: Open CHANGELOG clear PR
    needs: [apply-release-notes]
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # 组织的复合 checkout 硬写 persist-credentials: false，这一步要推分支，直接用官方 action。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Empty the [Unreleased] section and open the PR
        env:
          TAG: ${{ inputs.tag }}
          BASE: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="clear-changelog/${TAG}"
          title="chore(automate): Clear CHANGELOG.md for ${TAG}"

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "::notice::分支 ${branch} 已存在（重跑？），不重复开 PR。"
            exit 0
          fi
          if ! grep -qE '^## \[Unreleased\][[:space:]]*$' CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里找不到 ## [Unreleased] 标题。"
            exit 1
          fi
          # 只留标题与前言，段整段删掉——发出去的净结果已经在 Release 页。
          sed -e 's/\r$//' CHANGELOG.md | sed -n '1,/^## \[Unreleased\][[:space:]]*$/p' > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::notice::[Unreleased] 段本来就是空的，无需清空。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${title}"
          git push origin "HEAD:refs/heads/${branch}"

          {
            echo "发版 \`${TAG}\` 之后清空 CHANGELOG 的 \`[Unreleased]\` 段。"
            echo ""
            echo "这一段已作为 Release notes 发布：<https://github.com/${GH_REPO}/releases/tag/${TAG}>。"
            echo "合并后 \`[Unreleased]\` 重新从零记。"
            echo ""
            echo "请在打下一个 tag 之前合并本 PR——否则上一版条目会被下一个 Release 整段再发一次。"
            echo "若发版窗口里有人写了新条目，本 PR 会把它们一并清掉（整段删）；合并前请核对 diff。"
            echo ""
            echo "PR 由 GITHUB_TOKEN 开出，不触发 checks（本 PR 只动 CHANGELOG.md）。"
          } > "${RUNNER_TEMP}/pr-body.md"
          gh pr create --base "${BASE}" --head "${branch}" --title "${title}" --body-file "${RUNNER_TEMP}/pr-body.md"

  cleanup:
    # always()：release-notes 有意失败（空段）时 create-release 会被 skip，
    # 默认语义会连带跳过本步，update-packagejson 建的临时分支就泄在远端。
    if: ${{ always() && needs.update-packagejson.result == 'success' && needs.update-packagejson.outputs.is-branch-created == 'true' }}
    needs: [update-packagejson, create-release]
    permissions:
      contents: write
    uses: TeamMoirai/GitHubActions/.github/workflows/clean-packagejson-branch.yaml@master
    with:
      branch: ${{ needs.update-packagejson.outputs.branch-name }}
