# 发布链路。
#
# 触发：仅 workflow_dispatch（手动），输入 tag + dry-run。
#
# 顺序：package.json 版本 → 从 CHANGELOG.md 切出 `[Unreleased]` 段当 Release notes →
# 建 release → 把这份 notes 覆盖进 release 并 Publish → 开一个清空 `[Unreleased]` 段的 PR 等人工合并。
# notes 取的是被打 tag 那个提交里的 CHANGELOG，所以 tag 树与 Release 页自洽；
# master 上的清空要等 PR 合并才生效。dry-run 会切 notes 并打日志、调 create-release（dry），
# 但不 Publish、不建清空 PR。
#
# 两条硬约定（丢的是 CHANGELOG 内容，静默且难捞）：
# 1. 合并本次清空 PR 之后才能打下一个 tag——否则 Unreleased 里上一版条目会被下一个
#    Release 整段再发一次（空段闸门只挡「完全没写」，挡不住「重复发」）。
# 2. 发版进行中不要往 master 的 `[Unreleased]` 写新条目——清空 PR 按自己 checkout 时
#    的 tip 把整段删光，窗口期内新写的条目会一并消失且不进任何 Release。
#
# 为什么是事后改 body 而不是自己建 release：外部的 create-release 复用流硬编码
# `gh release create --draft --generate-notes`，没有 notes 入口。

name: build-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag: git tag you want create. (sample 1.0.0)"
        required: true
      dry-run:
        description: "dry-run: true will never create release/nuget."
        required: true
        default: false
        type: boolean

# 两条并发发布流水会互相踩 tag 与 CHANGELOG，排队而不是中途取消。
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-packagejson:
    permissions:
      actions: read
      contents: write
    uses: TeamMoirai/GitHubActions/.github/workflows/update-packagejson.yaml@master
    with:
      file-path: ./package.json
      tag: ${{ inputs.tag }}
      dry-run: ${{ inputs.dry-run }}

  release-notes:
    name: Cut release notes
    needs: [update-packagejson]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the commit being released
        uses: TeamMoirai/GitHubActions/.github/actions/checkout@master
        with:
          ref: ${{ needs.update-packagejson.outputs.sha }}
          # 上一版的 tag 要沿祖先找（生成 compare 链接），所以要全历史 + tags
          fetch-depth: 0
          fetch-tags: "true"

      - name: Cut the [Unreleased] section
        env:
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/unreleased.md"
          notes="${RUNNER_TEMP}/release-notes.md"

          if ! grep -qE '^## \[Unreleased\][[:space:]]*$' CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里找不到 ## [Unreleased] 标题。"
            exit 1
          fi
          # 段界 = [Unreleased] 标题之后到下一个 ## 之前；去掉首尾空行与 CRLF。
          sed -e 's/\r$//' CHANGELOG.md | awk '
            /^## \[Unreleased\][[:space:]]*$/ { f = 1; next }
            f && /^## /                       { f = 0 }
            f
          ' | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "${body}"
          if [ ! -s "${body}" ]; then
            echo "::error::[Unreleased] 段是空的，这一版没有可发行的内容。"
            exit 1
          fi

          prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            if [ -n "${prev}" ]; then
              printf '> 相对 `%s` 的净结果；逐条对比见 [%s...%s](https://github.com/%s/compare/%s...%s)。\n>\n' \
                "${prev}" "${prev}" "${TAG}" "${GH_REPO}" "${prev}" "${TAG}"
            fi
            printf '> 标记 ⚠ 的是破坏性变更。\n\n'
            cat "${body}"
          } > "${notes}"

          echo "release notes ↓↓↓"
          cat "${notes}"

      - uses: TeamMoirai/GitHubActions/.github/actions/upload-artifact@master
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 1

