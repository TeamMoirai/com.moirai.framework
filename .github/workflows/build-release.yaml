# 发布链路。
#
# 触发：仅 workflow_dispatch（手动），输入 tag + dry-run。
#
# 顺序：从 CHANGELOG.md 切出 `[Unreleased]` 段当 Release notes →
# 一笔 commit 同时写入 package.json 版本号并把 CHANGELOG 整份重置为空白模板 →
# 用这笔 commit 打 tag 建 release → 把先前切好的 notes 覆盖进 release 并 Publish。
# 该 commit 的 subject 是 `chore(automate): Bump version to v{版本}`，body 取 Release notes
# 里 `>` 之后、`<details>` 之前那截摘要（=`[Unreleased]` 中第一个 `###` 之前的段落）。
# package.json 与 CHANGELOG 同 commit，发版自动化只留一笔；
# notes 在换模板之前切出，所以 tag 树里 CHANGELOG 已是空白模板，发出去的条目
# 在 GitHub Releases 与该 commit 父提交的历史里。
# dry-run 会切 notes 并打日志、把合并 commit 推到 test-release/{版本}、调 create-release（dry），
# 但不 Publish。
#
# 两条硬约定（丢的是 CHANGELOG 内容，静默且难捞）：
# 1. 发版进行中不要往 master 的 `[Unreleased]` 写新条目——合并 commit 整文件换模板，
#    窗口期内新写的条目会一并消失且不进任何 Release。
# 2. 重跑时若本 tag 的 Release commit 已落地，notes 从其父提交的 CHANGELOG 重新切出，
#    不要手工往已换模板的 `[Unreleased]` 回填上一版条目。
#
# 为什么是事后改 body 而不是自己建 release：外部的 create-release 复用流硬编码
# `gh release create --draft --generate-notes`，没有 notes 入口。

name: build-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag: git tag you want create. (sample 1.0.0)"
        required: true
      dry-run:
        description: "dry-run: true will never create release/nuget."
        required: true
        default: false
        type: boolean

# 两条并发发布流水会互相踩 tag 与 CHANGELOG，排队而不是中途取消。
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Cut notes and commit package.json + CHANGELOG
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      # 组织的复合 checkout 硬写 persist-credentials: false，这一步要推分支，直接用官方 action。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          # 上一版的 tag 要沿祖先找（生成 compare 链接），所以要全历史 + tags
          fetch-depth: 0
          fetch-tags: "true"

      - name: Cut notes and write the release commit
        id: commit
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          BASE: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 与 TeamMoiraiActions validate-tag 同口径：去前缀 v，禁止空串。
          VERSION="${TAG#v}"
          if [ -z "${VERSION}" ]; then
            echo "::error::tag 不能为空。"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          # 禁止往回打更旧的 tag（有 release 时才比；解析不了就退回分段比较）。
          latest="$(gh release list --exclude-drafts --exclude-pre-releases --json tagName,isLatest \
            --jq '.[] | select(.isLatest == true) | .tagName' 2>/dev/null || true)"
          latest="${latest#v}"
          if [ -n "${latest}" ] && [ "${latest}" != "${VERSION}" ]; then
            if ! python3 - "${VERSION}" "${latest}" <<'PY'
          import sys
          def key(s):
              parts = s.replace('-', '.').split('.')
              out = []
              for p in parts:
                  out.append((0, int(p)) if p.isdigit() else (1, p))
              return out
          sys.exit(0 if key(sys.argv[1]) >= key(sys.argv[2]) else 1)
          PY
            then
              echo "::error::tag ${TAG} 早于最新 release ${latest}，拒绝回退版本。"
              exit 1
            fi
          fi

          # subject 固定 chore(automate) 前缀；body = Release notes 里 `>` 之后、
          # `<details>` 之前那截摘要（CHANGELOG `[Unreleased]` 里第一个 `###` 之前）。
          title="chore(automate): Bump version to v${VERSION}"
          branch="${BASE}"
          if [ "${DRY_RUN}" = "true" ]; then
            branch="test-release/${VERSION}"
          fi

          # 重跑：本 tag 的 Release commit 已在分支上 → 取回该 sha，从其父提交重切 notes，不重复提交。
          # subject 全串相等匹配，不走 --grep 正则（`v1.0.0` 里的 `.` 会误配）。
          existing_sha=""
          while read -r sha subject; do
            if [ "${subject}" = "${title}" ]; then
              existing_sha="${sha}"
              break
            fi
          done < <(git log "${BASE}" --format='%H %s')
          if [ -n "${existing_sha}" ]; then
            echo "::notice::\`${BASE}\` 上已有 commit message \`${title}\`（${existing_sha}），从其父提交重切 notes。"
            git show "${existing_sha}^:CHANGELOG.md" > CHANGELOG.md
            echo "sha=${existing_sha}" >> "${GITHUB_OUTPUT}"
            already_committed=1
          else
            already_committed=0
          fi

          # ---- 切 notes（在换模板之前；重跑路径上 CHANGELOG 已是父提交内容）----
          notes_body="${RUNNER_TEMP}/unreleased.md"
          notes="${RUNNER_TEMP}/release-notes.md"

          if ! grep -qE '^## \[Unreleased\][[:space:]]*$' CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里找不到 ## [Unreleased] 标题。"
            exit 1
          fi
          sed -e 's/\r$//' CHANGELOG.md | awk '
            /^## \[Unreleased\][[:space:]]*$/ { f = 1; next }
            f && /^## /                       { f = 0 }
            f
          ' | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "${notes_body}"
          if [ ! -s "${notes_body}" ]; then
            echo "::error::[Unreleased] 段是空的，这一版没有可发行的内容。"
            exit 1
          fi

          # 摘要 = 第一个 `###` 之前；详细日志 = 其后。均无则整段当摘要。
          if grep -qE '^### ' "${notes_body}"; then
            summary="$(awk '/^### /{exit} {print}' "${notes_body}" | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}')"
            detail="$(sed -n '/^### /,$p' "${notes_body}")"
          else
            summary="$(cat "${notes_body}")"
            detail=""
          fi

          prev="$(git describe --tags --abbrev=0 "${existing_sha:-HEAD}^" 2>/dev/null || true)"
          {
            if [ -n "${prev}" ]; then
              printf '> 相对 `%s` 的净结果；逐条对比见 [%s...%s](https://github.com/%s/compare/%s...%s)。\n>\n' \
                "${prev}" "${prev}" "${TAG}" "${GH_REPO}" "${prev}" "${TAG}"
            fi
            printf '> 标记 ⚠ 的是破坏性变更。\n'
            if [ -n "${summary}" ]; then
              printf '\n%s\n' "${summary}"
            fi
            if [ -n "${detail}" ]; then
              printf '\n<details>\n  <summary>点击展开详细更新日志</summary>\n\n%s\n\n</details>\n' "${detail}"
            fi
          } > "${notes}"

          echo "release notes ↓↓↓"
          cat "${notes}"
          mkdir -p "${RUNNER_TEMP}/artifact"
          cp "${notes}" "${RUNNER_TEMP}/artifact/release-notes.md"

          # 重跑已提交则不再改文件、不再推。
          if [ "${already_committed}" = "1" ]; then
            exit 0
          fi

          # ---- 一笔 commit：package.json 版本 + CHANGELOG 空白模板 ----
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" package.json
          python3 -c 'import json,sys; assert json.load(open("package.json", encoding="utf-8"))["version"]==sys.argv[1]' "${VERSION}"

          cat > CHANGELOG.md << 'EOF'
          # Changelog

          格式遵循 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，版本号遵循 [SemVer](https://semver.org/lang/zh-CN/)。

          本文件只留 `[Unreleased]` 一段，按**后覆盖**维护：只记尚未发行的净结果，发版时该段定名后移到 [GitHub Releases](https://github.com/TeamMoirai/com.moirai.framework/releases) 并清空。被后续变更推翻的中间态不留条目——同一件事被推翻时改掉或删掉原条目。排版：段首可写一段摘要（第一个 `###` 之前，发版时进 Release notes 的 `>` 引言之后、也是 release commit 的 body）；`###` 是变更类型，段内 `####` 按模块分组，一条只说一个事实、写成一行不折行，发版时整段进 `<details>` 详细日志。面向外部读者压缩精简，只写净结果与迁移口径，诊断与来龙去脉不进本文件。标记 ⚠ 的是破坏性变更。

          ## [Unreleased]
          EOF

          git add package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::notice::工作树已是发版终态，无需提交。"
            echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${summary}" ]; then
            git commit -m "${title}" -m "${summary}"
          else
            git commit -m "${title}"
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            git push origin "HEAD:refs/heads/${branch}"
          else
            git pull --rebase origin "${BASE}"
            git push origin "HEAD:refs/heads/${BASE}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - uses: TeamMoirai/GitHubActions/.github/actions/upload-artifact@master
        with:
          name: release-notes
          path: ${{ runner.temp }}/artifact/release-notes.md
          retention-days: 1

